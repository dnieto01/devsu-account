spring.application.name=devsu-account
server.port=${SERVER_PORT:8096}

# ===== Datasource (Postgres) =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

# ===== Lock (Redis) =====
redis.host=${REDIS_HOST}
redis.port=${REDIS_PORT:6379}
lock.ttl-millis=${LOCK_TTL_MILLIS:60000}

# ===== Kafka =====
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:account-consumer}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.ds.devsuaccount.infraestructure.queue.dto.EventMessage

# ===== MongoDB =====
spring.mongodb.uri=${SPRING_MONGODB_URI}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:devsu-account}

# ===== Cache (Caffeine) =====
spring.cache.type=caffeine
spring.cache.maximumSize=${SPRING_CACHE_MAXIMUM_SIZE:5000}
spring.cache.expireAfterWrite=${SPRING_CACHE_EXPIRE_AFTER_WRITE:10}

# ===== Logging =====
logging.level.root=INFO
logging.level.com.ds.devsuaccount=INFO
